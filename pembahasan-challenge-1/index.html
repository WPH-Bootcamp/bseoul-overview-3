<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Challenge 1</title>
    <link rel="stylesheet" href="./css/style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Sora:wght@100..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div class="logo">
        <img src="./assets/logo.svg" alt="Ini adalah logo" />
      </div>

      <div class="hamburger-icon" id="hamburgerBtn">
        <img src="./assets/hamburger.svg" alt="" />
      </div>

      <div class="navbar">
        <nav>
          <ul>
            <li>
              <a href="#">About</a>
            </li>
            <li>
              <a href="#">Service</a>
            </li>
            <li>
              <a href="#">Our Work</a>
            </li>
            <li>
              <a href="#">Team</a>
            </li>
          </ul>
        </nav>
        <button>Contact Us</button>
      </div>
    </header>

    <section class="hero">
      <div class="container">
        <div class="container-left">
          <h1>Build with the <span>Future.</span></h1>
          <p>
            From building sleek websites and mobile apps to integrating AI
            solutions, we help brands turn ideas into powerful digital
            experiences that connect, engage, and scale.
          </p>
          <button>Let’ss Talk</button>
        </div>
        <div class="container-right">
          <img src="./assets/hand.png" alt="Ini gambar tangan" />
        </div>
      </div>
    </section>

    <script>
      const hamburgerBtn = document.getElementById("hamburgerBtn");
      const navbar = document.querySelector(".navbar");

      hamburgerBtn.addEventListener("click", () => {
        navbar.classList.toggle("show");
      });
    </script>
  </body>
</html>
